name: Update README Stats

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate local stats cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from html import escape
          from pathlib import Path

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
          }

          def get(path):
              request = urllib.request.Request(
                  f"https://api.github.com/{path}", headers=headers
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          user = get("users/Aviral02728")
          repos = get("users/Aviral02728/repos?type=owner&per_page=100")
          stars = sum(repo["stargazers_count"] for repo in repos)
          commits = get("search/commits?" + urllib.parse.urlencode({"q": "author:Aviral02728"}))["total_count"]
          pull_requests = get("search/issues?" + urllib.parse.urlencode({"q": "author:Aviral02728 type:pr"}))["total_count"]
          issues = get("search/issues?" + urllib.parse.urlencode({"q": "author:Aviral02728 type:issue"}))["total_count"]
          languages = {}
          for repo in repos:
              for language, amount in get(f"repos/Aviral02728/{repo['name']}/languages").items():
                  languages[language] = languages.get(language, 0) + amount

          total = sum(languages.values()) or 1
          top_languages = sorted(languages.items(), key=lambda item: item[1], reverse=True)[:5]
          colors = {
              "JavaScript": "#f1e05a",
              "HTML": "#e34c26",
              "CSS": "#563d7c",
              "Python": "#3572A5",
              "Jupyter Notebook": "#da5b0b",
          }
          contribution_total = commits + pull_requests + issues

          def stats_svg():
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560"><title>Aviral's GitHub Stats</title><rect width="980" height="560" fill="#0d1117"/><g font-family="Arial,Helvetica,sans-serif"><rect x="1" y="1" width="978" height="245" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="38" y="45" fill="#f0f6fc" font-size="29" font-weight="700">Aviral's GitHub Stats</text><g fill="#a8b0ba" font-size="19" font-weight="700"><text x="38" y="94">Total Stars Earned:</text><text x="435" y="94" fill="#f0f6fc">{stars}</text><text x="38" y="132">Total Commits:</text><text x="435" y="132" fill="#f0f6fc">{commits}</text><text x="38" y="170">Total PRs:</text><text x="435" y="170" fill="#f0f6fc">{pull_requests}</text><text x="38" y="208">Total Issues:</text><text x="435" y="208" fill="#f0f6fc">{issues}</text></g><circle cx="760" cy="135" r="77" fill="none" stroke="#3d444d" stroke-width="14"/><circle cx="760" cy="135" r="77" fill="none" stroke="#70a5fd" stroke-width="14" stroke-linecap="round" stroke-dasharray="34 450" transform="rotate(-90 760 135)"/><text x="760" y="148" text-anchor="middle" fill="#70a5fd" font-size="38" font-weight="700">C</text><rect x="1" y="274" width="978" height="285" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/><line x1="327" y1="325" x2="327" y2="510" stroke="#c9d1d9" stroke-width="2"/><line x1="653" y1="325" x2="653" y2="510" stroke="#c9d1d9" stroke-width="2"/><text x="164" y="385" text-anchor="middle" fill="#f0f6fc" font-size="48" font-weight="700">{contribution_total}</text><text x="164" y="430" text-anchor="middle" fill="#f0f6fc" font-size="22">Total Contributions</text><text x="164" y="465" text-anchor="middle" fill="#8b949e" font-size="17">Public activity</text><circle cx="490" cy="375" r="48" fill="none" stroke="#ff9800" stroke-width="11"/><text x="490" y="388" text-anchor="middle" fill="#f0f6fc" font-size="34" font-weight="700">C</text><text x="490" y="465" text-anchor="middle" fill="#ff9800" font-size="21" font-weight="700">Contribution Streak</text><text x="816" y="385" text-anchor="middle" fill="#f0f6fc" font-size="48" font-weight="700">{user["public_repos"]}</text><text x="816" y="430" text-anchor="middle" fill="#f0f6fc" font-size="22">Public Repositories</text><text x="816" y="465" text-anchor="middle" fill="#8b949e" font-size="17">Aviral02728</text></g></svg>'''

          def languages_svg():
              rows = []
              for index, (language, amount) in enumerate(top_languages):
                  percent = round(amount / total * 100)
                  y = 145 + (index // 2) * 50
                  x = 48 if index % 2 == 0 else 380
                  rows.append(
                      f'<circle cx="{x}" cy="{y - 6}" r="10" fill="{colors.get(language, "#8b949e")}"/>'
                      f'<text x="{x + 22}" y="{y}" fill="#a8b0ba">{escape(language)} {percent}%</text>'
                  )
              segments = []
              offset = 38
              for language, amount in top_languages:
                  width = max(8, round(amount / total * 644))
                  segments.append(f'<rect x="{offset}" y="78" width="{width}" height="18" fill="{colors.get(language, "#8b949e")}"/>')
                  offset += width
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320"><title>Aviral's Most Used Languages</title><rect width="720" height="320" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/><g font-family="Arial,Helvetica,sans-serif"><text x="38" y="50" fill="#f0f6fc" font-size="29" font-weight="700">Most Used Languages</text>{''.join(segments)}{''.join(rows)}</g></svg>'''

          Path("profile").mkdir(exist_ok=True)
          Path("profile/stats.svg").write_text(stats_svg(), encoding="utf-8")
          Path("profile/top-langs.svg").write_text(languages_svg(), encoding="utf-8")
          PY

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update README stats cards"
            git push
          else
            echo "No changes to commit."
          fi
